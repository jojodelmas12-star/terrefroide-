  float l=dot(col,vec3(.299,.587,.114));col=mix(vec3(l),col,1.12);

const STANDALONE=false;
const mkEntry=(l,m)=>({peer:l,by:null,isMe:m,sameTab:m,kind:'viewer',guest:false,presence:{},updatedAt:0});
const lobbyMe=mkEntry('lobby',true);
const P2PL={peers:()=>[lobbyMe],on:()=>()=>{},emit:async()=>{},presence:async()=>{},leave:async()=>{},connected:()=>false,onPeers:()=>()=>{},onConnection:()=>()=>{},join:(n,m)=>p2pJoin(n,m)};
function p2pJoin(name,mode){return new Promise((resolve,reject)=>{
 let done=false;const hostId='tfroom-'+name;
 const tm=setTimeout(()=>ko('Délai dépassé : serveur de connexion injoignable ou salle introuvable.'),12000);
 const ok=r=>{if(done)return;done=true;clearTimeout(tm);resolve(r)},ko=m=>{if(done)return;done=true;clearTimeout(tm);reject({msg:m})};
 const startClient=()=>{const cp=new Peer('tfp-'+Math.random().toString(36).slice(2,10));
  cp.on('error',e=>ko(e.type=='peer-unavailable'?'Salle introuvable : vérifie le code.':'Connexion impossible ('+e.type+').'));
  cp.on('open',id=>{const c=cp.connect(hostId,{serialization:'json',reliable:true});c.on('open',()=>ok(mkRoom(name,cp,id,c)));c.on('error',()=>ko('Connexion à la salle impossible.'))})};
 if(mode=='client'){startClient();return}
 const hp=new Peer(hostId);
 hp.on('error',e=>{if(e.type=='unavailable-id'){if(mode=='host')ko('Ce code est déjà utilisé, réessaie.');else startClient()}else ko('Connexion impossible ('+e.type+').')});
 hp.on('open',id=>ok(mkRoom(name,hp,id,null)))})}
function mkRoom(name,peer,id,hc){
 const me=mkEntry(id,true),others={},conns={},H={},isHost=!hc;let arr=[me],pend={},tmr=0,closed=false;
 const rebuild=()=>{arr=[me].concat(Object.values(others))};
 const mg=(t,p)=>{for(const k in p){if(p[k]===null)delete t[k];else t[k]=p[k]}};
 const deliver=(from,topic,data)=>{const hs=H[topic];if(!hs)return;const m={peer:from,by:null,sameTab:from==id,isMe:from==id,kind:'viewer',guest:false,topic,data};hs.forEach(f=>{try{f(m)}catch(e){}})};
 const sendAll=(m,except)=>{for(const k in conns)if(k!=except)try{conns[k].send(m)}catch(e){}};
 const ensure=l=>{if(!others[l]){others[l]=mkEntry(l,false);rebuild()}return others[l]};
 const handle=(from,m)=>{if(!m)return;
  if(m.t=='pres'&&m.p){mg(ensure(from).presence,m.p);if(isHost)sendAll({t:'pres',from,p:m.p},from)}
  else if(m.t=='ev'){deliver(from,m.topic,m.data);if(isHost)sendAll({t:'ev',from,topic:m.topic,data:m.data},from)}
  else if(m.t=='snap'&&m.all){for(const l in m.all)if(l!=id)mg(ensure(l).presence,m.all[l])}
  else if(m.t=='join'){if(m.from!=id)ensure(m.from)}
  else if(m.t=='left'){if(others[m.from]){delete others[m.from];rebuild()}}};
 const flush=()=>{tmr=0;if(closed)return;const m={t:'pres',from:id,p:pend};pend={};if(isHost)sendAll(m);else try{hc.send(m)}catch(e){}};
 const lost=()=>{if(closed)return;closed=true;for(const k in others)delete others[k];rebuild();typeof banner=='function'&&banner('Connexion à la salle perdue')};
 peer.on('error',()=>{});
 if(isHost){peer.on('connection',c=>{const l=c.peer;conns[l]=c;
  c.on('open',()=>{ensure(l);const all={};all[id]=me.presence;for(const k in others)all[k]=others[k].presence;try{c.send({t:'snap',all})}catch(e){}sendAll({t:'join',from:l},l)});
  c.on('data',m=>handle(l,m));c.on('close',()=>{delete conns[l];if(others[l]){delete others[l];rebuild()}sendAll({t:'left',from:l})});c.on('error',()=>{})})}
 else{hc.on('data',m=>handle(m&&m.from||('tfroom-'+name),m));hc.on('close',lost);hc.on('error',()=>{})}
 return {name,peers:()=>arr,connected:()=>!closed,onPeers:()=>()=>{},onConnection:()=>()=>{},
  on:(t,f)=>{(H[t]=H[t]||new Set()).add(f);return()=>H[t].delete(f)},
  emit:async(t,d)=>{if(closed)return;deliver(id,t,d);const m={t:'ev',from:id,topic:t,data:d};if(isHost)sendAll(m);else try{hc.send(m)}catch(e){}},
  presence:async p=>{mg(me.presence,p);Object.assign(pend,p);if(!tmr)tmr=setTimeout(flush,66)},
  leave:async()=>{closed=true;try{peer.destroy()}catch(e){}}}}
